name: Testar lojas

# Descobre quais sites podem ser lidos de graça (VTEX, Shopify ou feed RSS).
on:
  workflow_dispatch:
  push:
    paths: [tools/testar_lojas.py, tools/testar_ml.py, .github/workflows/testar-lojas.yml, monitoramento.yml, app/services/lojas.py]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/testar_lojas.py ofertas
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
