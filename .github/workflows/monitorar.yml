name: Monitorar promoções

on:
  # A cada 30 minutos confere só o que é GRÁTIS (lojas e blogs). Passagens, hotéis e produtos do
  # Google (SerpApi) só rodam quando você clica em "Run workflow".
  # O agendamento do GitHub às vezes atrasa ou pula horários; para garantir os 30 minutos, um
  # serviço externo (cron-job.org) também pode chamar este workflow com "so_gratis" ligado.
  schedule:
    - cron: "17,47 * * * *"
  issues:
    types: [opened, edited, reopened]  # confere o formulário na hora e responde no issue
  workflow_dispatch:
    inputs:
      simular:
        description: "Só simular (mostra as mensagens no log, sem postar no Telegram)"
        type: boolean
        default: false
      so_gratis:
        description: "Só lojas e blogs (grátis, não gasta SerpApi) — usado pelo agendamento externo"
        type: boolean
        default: false
      diagnosticar_telegram:
        description: "Só diagnosticar o Telegram (mostra o endereço certo do canal, não pesquisa nada)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # ler os formulários e responder neles

concurrency:
  group: monitorar-${{ github.event_name == 'issues' && github.event.issue.number || 'diario' }}
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Conferir formulário
        if: >-
          github.event_name == 'issues' &&
          contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.issue.author_association)
        run: python -m app.monitor
        env:
          VALIDAR_ISSUE: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lista das ofertas já postadas, para não repetir no canal
      - name: Recuperar ofertas já postadas
        if: github.event_name != 'issues'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: enviados-${{ github.run_id }}
          restore-keys: enviados-

      - name: Diagnosticar Telegram
        if: github.event_name == 'workflow_dispatch' && inputs.diagnosticar_telegram
        run: python -m app.diagnostico_telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Pesquisar e postar
        if: github.event_name != 'issues' && !inputs.diagnosticar_telegram
        run: |
          mkdir -p data
          python -m app.monitor
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIMULAR: ${{ inputs.simular }}
          SO_GRATIS: ${{ github.event_name == 'schedule' || inputs.so_gratis }}
          MAXIMO_POSTS: "15"  # no máximo 15 ofertas por execução, para não inundar o canal
          REENVIO_HORAS: "168"  # a mesma oferta só volta a ser postada depois de 7 dias
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar ofertas já postadas
        if: always() && github.event_name != 'issues'
        uses: actions/cache/save@v4
        with:
          path: data
          key: enviados-${{ github.run_id }}
