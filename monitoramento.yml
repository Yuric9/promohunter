# =====================================================================
#  CONFIGURAÇÃO DO PROMOHUNTER
#
#  O jeito fácil é pelos FORMULÁRIOS: aba "Issues" → "New issue" e
#  escolha ✈️ Passagem, 🏨 Hospedagem, 🛒 Produto ou 📢 Promoções de blogs.
#  Para parar de monitorar algo, feche o issue.
#
#  Este arquivo continua funcionando para quem prefere escrever à mão
#  (tudo que estiver aqui é somado aos formulários). Exemplos:
#
#  produtos:
#    - termo: air fryer
#      preco_max: 400
#      desconto_min: 0
#
#  voos:
#    - origem: GYN
#      destino: REC
#      ida_em_dias: 45     # ou: ida: 2026-12-20
#      duracao_dias: 7
#      adultos: 1
#      preco_max: 1500
#      so_preco_baixo: true
#
#  hospedagens:
#    - local: pousadas em Pirenópolis
#      checkin_em_dias: 20 # ou: checkin: 2026-12-19
#      noites: 2
#      adultos: 2
#      diaria_max: 400
#      nota_min: 4.0
#
#  anuncios:
#    - nome: Passagens em promoção
#      feeds: [https://www.melhoresdestinos.com.br/feed]
#      palavras: [passagem, passagens, voo, voos]
#      ultimos_dias: 2
#
#  ⚠️ Cada produto/voo/hospedagem gasta 1 busca da SerpApi por dia
#     (plano grátis = 250/mês → até 8 itens). Blogs são grátis.
# =====================================================================
